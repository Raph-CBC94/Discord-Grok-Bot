<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Grok Bot</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
      main { width: min(92vw, 560px); padding: 36px; border: 1px solid #374151; border-radius: 18px; background: #1f2937; box-shadow: 0 20px 60px #0006; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 30px; }
      p { color: #d1d5db; line-height: 1.6; }
      a { display: inline-block; margin-top: 16px; padding: 11px 18px; border-radius: 10px; background: #5865f2; color: white; text-decoration: none; font-weight: 700; }
      .status { display: inline-flex; align-items: center; gap: 8px; color: #86efac; font-weight: 700; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
    </style>
  </head>
  <body>
    <main>
      <div class="status"><span class="dot"></span> Service déployé</div>
      <h1>Discord Grok Bot</h1>
      <p>Le point d'accès API du bot est disponible. Cette page confirme que le déploiement Vercel fonctionne.</p>
      <a href="/api">Tester l'API</a>
    </main>
  </body>
</html>
